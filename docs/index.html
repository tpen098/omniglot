<h2 id="rust-combines-compile-time-rules-with-runtime-checks">Rust combines compile-time rules with runtime checks</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-rust"><span class="hljs-keyword">let</span> <span class="hljs-variable">view</span>: &amp;[<span class="hljs-type">u8</span>] = &amp;[<span class="hljs-number">0</span>, <span class="hljs-number">1</span>, <span class="hljs-number">2</span>];

</code></pre>
<div class="cols">
<div><h3>Compile time</h3><p>Types and borrowing rules constrain the program.</p></div>
<div><h3>At execution</h3><p>Runtime checks enforce rules that depend on actual values.</p></div>
</div>

<h2 id="how-a-rust-call-reaches-foreign-code">How a Rust call reaches foreign code</h2>
<div class="cols">
<div><h3>Foreign function interface</h3><p>The FFI lets Rust declare and call a function implemented in another language.</p></div>
<div><h3>Application binary interface</h3><p>The ABI specifies how compiled code passes arguments and returns results.</p></div>
</div>
<div class="planned-progress" aria-hidden="true" style="width:17.320261437908496%"></div>
<footer>Schuermann et al. · OSDI ’25 · §2.1, Listing 1 · §3, Fig. 2 · §5.3</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="Schuermann et al. · OSDI ’25 · §2.1, Listing 1 · §3, Fig. 2 · Rust Reference, External blocks" data-theme="0t5cqnwe1fctnxl3vapah9v6wy9d8ax2r62l2qk6arsu" lang="C" data-marpit-pagination="8" style="--paginate:true;--footer:Schuermann et al. · OSDI ’25 · §2.1, Listing 1 · §3, Fig. 2 · Rust Reference, External blocks;--theme:0t5cqnwe1fctnxl3vapah9v6wy9d8ax2r62l2qk6arsu;" data-marpit-pagination-total="37" data-size="16:9">
<h2 id="rust-trusts-the-return-type-in-a-foreign-declaration">Rust trusts the return type in a foreign declaration</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-rust"><span class="hljs-keyword">unsafe</span> <span class="hljs-keyword">extern</span> <span class="hljs-string">&quot;C&quot;</span> {
    <span class="hljs-keyword">fn</span> <span class="hljs-title function_">f</span>() <span class="hljs-punctuation">-&gt;</span> <span class="hljs-type">bool</span>;
}
</code></pre>
<div class="rows">
<strong><code>extern "C"</code></strong><span>Declare an external symbol using the C ABI.</span>
<strong><code>unsafe</code></strong><span>The declaration must match the external function.</span>
<strong><code>→ bool</code></strong><span>The caller expects a valid Rust Boolean.</span>
</div>
<div class="planned-progress" aria-hidden="true" style="width:20.58823529411765%"></div>

<h2 id="a-raw-pointer-carries-fewer-guarantees-than-a-reference">A raw pointer carries fewer guarantees than a reference</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-rust"><span class="hljs-keyword">let</span> <span class="hljs-variable">byte</span> = <span class="hljs-number">1_u8</span>;
<span class="hljs-keyword">let</span> <span class="hljs-variable">shared</span>: &amp;<span class="hljs-type">u8</span> = &amp;byte;

<h1 id="memory-isolation-is-not-type-safety">Memory isolation is not type safety.</h1>
<p>A library can stay inside its memory region and still return the byte 2 where Rust expects a Boolean.</p>
<div class="planned-progress" aria-hidden="true" style="width:36.60130718954248%"></div>

<h2 id="how-omniglot-protects-a-rust-caller">How Omniglot protects a Rust caller</h2>
<div class="cols three">
<div><h3>Isolation</h3><p>Confine the library to permitted memory.</p></div>
<div><h3>Validation</h3><p>Check the storage and the value before a read.</p></div>
<div><h3>Scopes</h3><p>Keep those checks valid while Rust uses the view.</p></div>
</div>

<h2 id="rust-permits-shared-reads-or-an-exclusive-write">Rust permits shared reads or an exclusive write</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-rust"><span class="hljs-keyword">let</span> <span class="hljs-keyword">mut </span><span class="hljs-variable">byte</span> = <span class="hljs-number">1_u8</span>;
<span class="hljs-keyword">let</span> <span class="hljs-variable">a</span> = &amp;byte;
<span class="hljs-keyword">let</span> <span class="hljs-variable">b</span> = &amp;byte;
<span class="hljs-built_in">assert_eq!</span>(*a, *b);    <span class="hljs-comment">// last use of both readers</span>
<span class="hljs-keyword">let</span> <span class="hljs-variable">writer</span> = &amp;<span class="hljs-keyword">mut</span> byte;
*writer = <span class="hljs-number">0</span>;
</code></pre>
<p class="caption">Both shared readers finish using the byte before Rust permits an exclusive write.</p>

<h2 id="omniglot-tracks-storage-lifetime-and-checked-access-separately">Omniglot tracks storage lifetime and checked access separately</h2>
<div class="cols">
<div><h3><code>AllocScope</code></h3><p>A storage wrapper can live only as long as its allocation.</p></div>
<div><h3><code>AccessScope</code></h3><p>A live validated view blocks writes through other wrappers.</p></div>
</div>

<h2 id="the-security-guarantee-depends-on-the-runtime">The security guarantee depends on the runtime</h2>
<div class="cols">
<div><h3>OG<sub>PMP</sub> · strong</h3><p>RISC-V PMP confines lower-privilege code in Tock. The runtime controls when it runs.</p></div>
<div><h3>OG<sub>MPK</sub> · weak</h3><p>x86 protection keys limit page access in Linux. The prototype relies on library cooperation.</p></div>

<h2 id="how-the-paper-evaluates-zero-copy">How the paper evaluates zero-copy</h2>
<p class="experiment-intro">PNG decoding produces a buffer of pixels. The researchers compare three ways to access that output.</p>
<div class="cols three">
<div><h3>Unsafe FFI</h3><p>Call the decoder directly and access its output.</p></div>
<div><h3>OG<sub>MPK</sub></h3><p>Check the buffer and read it in place.</p></div>
<div><h3>Sandcrust</h3><p>Serialize and copy the pixels across a process boundary.</p></div>
</div>
<p class="caption">Sandcrust isolates a separate process. OG<sub>MPK</sub> relies on library cooperation.</p>

<h2 id="what-host-soundness-leaves-open">What host soundness leaves open</h2>
<div class="rows">
<strong>Correctness</strong><span>The library can return a valid <code>true</code> when the answer should be <code>false</code>.</span>
<strong>Side channels</strong><span>Timing can still reveal private information.</span>
</div>
<div class="planned-progress" aria-hidden="true" style="width:93.79084967320262%"></div>
<footer>Schuermann et al. · OSDI ’25 · §4.1, p. 600 · §5.2, p. 604</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-footer="Schuermann et al. · OSDI ’25 · §3, p. 599 · §4.3, p. 601 · Rust Reference, Pointer types" data-theme="0t5cqnwe1fctnxl3vapah9v6wy9d8ax2r62l2qk6arsu" lang="C" data-marpit-pagination="30" style="--paginate:true;--footer:Schuermann et al. · OSDI ’25 · §3, p. 599 · §4.3, p. 601 · Rust Reference, Pointer types;--theme:0t5cqnwe1fctnxl3vapah9v6wy9d8ax2r62l2qk6arsu;" data-marpit-pagination-total="37" data-size="16:9">
<h2 id="some-types-need-more-evidence-than-their-bytes">Some types need more evidence than their bytes</h2>
<div class="rows">
<strong><code>u8</code></strong><span>Every initialized byte pattern is a value.</span>
<strong><code>bool</code></strong><span>Only byte patterns 0 and 1 are valid.</span>
<strong>References</strong><span>Need evidence of origin, lifetime, and permitted access.</span>
</div>
<div class="planned-progress" aria-hidden="true" style="width:97.38562091503267%"></div>
<footer>Schuermann et al. · OSDI ’25 · §3, p. 599 · §4.3, p. 601 · Rust Reference, Pointer types</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-class="question" data-footer="Schuermann et al. · OSDI ’25 · §§3–4.4 and 9" data-theme="0t5cqnwe1fctnxl3vapah9v6wy9d8ax2r62l2qk6arsu" lang="C" class="question" data-marpit-pagination="31" style="--paginate:true;--class:question;--footer:Schuermann et al. · OSDI ’25 · §§3–4.4 and 9;--theme:0t5cqnwe1fctnxl3vapah9v6wy9d8ax2r62l2qk6arsu;" data-marpit-pagination-total="37" data-size="16:9">
<h1 id="safe-interoperability-requires-more-than-a-sandbox">Safe interoperability requires more than a sandbox</h1>
<p>A strong runtime confines the library. Validation lets Rust read foreign data in place. Scopes keep that read valid through its last use.</p>
<div class="planned-progress" aria-hidden="true" style="width:100%"></div>
<footer>Schuermann et al. · OSDI ’25 · §§3–4.4 and 9</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-class="backup" data-footer="Q&amp;A backup · Schuermann et al. · §4.3, Fig. 3, p. 601 · §4.4, Table 1, p. 602" data-theme="0t5cqnwe1fctnxl3vapah9v6wy9d8ax2r62l2qk6arsu" lang="C" class="backup" data-marpit-pagination="32" style="--paginate:true;--class:backup;--footer:Q&amp;A backup · Schuermann et al. · §4.3, Fig. 3, p. 601 · §4.4, Table 1, p. 602;--theme:0t5cqnwe1fctnxl3vapah9v6wy9d8ax2r62l2qk6arsu;" data-marpit-pagination-total="37" data-size="16:9">
<h2 id="why-isnt-ogmutreft-a-rust-mut-t">Why isn’t <code>OGMutRef&lt;T&gt;</code> a Rust <code>&amp;mut T</code>?</h2>
<p class="answer">Two checked wrappers can point to the same byte.</p>
<p>A successful <code>upgrade()</code> proves the storage is usable. Writing through either wrapper still requires exclusive access to the library’s <code>AccessScope</code>.</p>
<footer>Q&amp;A backup · Schuermann et al. · §4.3, Fig. 3, p. 601 · §4.4, Table 1, p. 602</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-class="backup" data-footer="Q&amp;A backup · Schuermann et al. · §4.4, Table 1, p. 602 · §4.5, Listing 3, p. 603" data-theme="0t5cqnwe1fctnxl3vapah9v6wy9d8ax2r62l2qk6arsu" lang="C" class="backup" data-marpit-pagination="33" style="--paginate:true;--class:backup;--footer:Q&amp;A backup · Schuermann et al. · §4.4, Table 1, p. 602 · §4.5, Listing 3, p. 603;--theme:0t5cqnwe1fctnxl3vapah9v6wy9d8ax2r62l2qk6arsu;" data-marpit-pagination-total="37" data-size="16:9">
<h2 id="why-does-omniglot-separate-allocation-and-access-scopes">Why does Omniglot separate allocation and access scopes?</h2>
<p class="answer">A write can change a checked value while its allocation stays live.</p>
<div class="rows">
<strong>One conservative scope</strong><span>Could block both writes and release while any wrapper is live.</span>
<strong>Omniglot’s two scopes</strong><span>An upgraded wrapper keeps storage live. A validated view also blocks writes.</span>
</div>
<footer>Q&amp;A backup · Schuermann et al. · §4.4, Table 1, p. 602 · §4.5, Listing 3, p. 603</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-class="backup" data-footer="Q&amp;A backup · Schuermann et al. · §4.1, p. 600 · §§5.1–5.2, p. 604" data-theme="0t5cqnwe1fctnxl3vapah9v6wy9d8ax2r62l2qk6arsu" lang="C" class="backup" data-marpit-pagination="34" style="--paginate:true;--class:backup;--footer:Q&amp;A backup · Schuermann et al. · §4.1, p. 600 · §§5.1–5.2, p. 604;--theme:0t5cqnwe1fctnxl3vapah9v6wy9d8ax2r62l2qk6arsu;" data-marpit-pagination-total="37" data-size="16:9">
<h2 id="can-a-malicious-c-library-bypass-omniglot">Can a malicious C library bypass Omniglot?</h2>
<p class="answer">The Tock prototype can confine an adversarial library. The Linux prototype relies on its cooperation.</p>
<div class="rows">
<strong>OG<sub>PMP</sub></strong><span>Lower privilege and restricted execution protect the host.</span>
<strong>OG<sub>MPK</sub></strong><span>Uncontrolled system calls or background threads can break the assumptions.</span>
</div>
<footer>Q&amp;A backup · Schuermann et al. · §4.1, p. 600 · §§5.1–5.2, p. 604</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-class="backup" data-footer="Q&amp;A backup · Schuermann et al. · §§4.2–4.4, pp. 600–602 · §6.2, Fig. 5, p. 607" data-theme="0t5cqnwe1fctnxl3vapah9v6wy9d8ax2r62l2qk6arsu" lang="C" class="backup" data-marpit-pagination="35" style="--paginate:true;--class:backup;--footer:Q&amp;A backup · Schuermann et al. · §§4.2–4.4, pp. 600–602 · §6.2, Fig. 5, p. 607;--theme:0t5cqnwe1fctnxl3vapah9v6wy9d8ax2r62l2qk6arsu;" data-marpit-pagination-total="37" data-size="16:9">
<h2 id="why-not-copy-foreign-data-into-rust-owned-memory">Why not copy foreign data into Rust-owned memory?</h2>
<p class="answer">Copy when Rust needs to keep the result beyond the foreign allocation’s lifetime.</p>
<div class="cols">
<div><h3>Keep a snapshot</h3><p>Copy from readable storage, then validate the copied representation before using it as a typed value.</p></div>
<div><h3>Use it now</h3><p>Borrow the checked output in place. The view ends when its scope does.</p></div>
</div>
<footer>Q&amp;A backup · Schuermann et al. · §§4.2–4.4, pp. 600–602 · §6.2, Fig. 5, p. 607</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-class="backup" data-footer="Q&amp;A backup · Schuermann et al. · §§4.1–4.2, p. 600 · §5.1, p. 604" data-theme="0t5cqnwe1fctnxl3vapah9v6wy9d8ax2r62l2qk6arsu" lang="C" class="backup" data-marpit-pagination="36" style="--paginate:true;--class:backup;--footer:Q&amp;A backup · Schuermann et al. · §§4.1–4.2, p. 600 · §5.1, p. 604;--theme:0t5cqnwe1fctnxl3vapah9v6wy9d8ax2r62l2qk6arsu;" data-marpit-pagination-total="37" data-size="16:9">
<h2 id="what-if-the-library-crashes-hangs-or-returns-the-wrong-result">What if the library crashes, hangs, or returns the wrong result?</h2>
<p class="answer">Protecting Rust’s soundness still leaves the host responsible for handling failure.</p>
<div class="rows">
<strong>Fault</strong><span>OG<sub>PMP</sub> reports a trapped library fault as an error.</span>
<strong>Hang</strong><span>The paper gives no guarantee that a call returns.</span>
<strong>Wrong result</strong><span>A valid <code>true</code> can still be the wrong answer.</span>
</div>
